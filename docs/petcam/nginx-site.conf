server {
    listen 80 default_server;
    server_name tom.local;

    # Jellyfin — official subpath mode (BaseUrl=/jf set in jellyfin config)
    location = /jf { return 301 /jf/; }
    location /jf/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # qBittorrent — prefix stripped, gated by basic auth (proxy = localhost to
    # qbittorrent, which would otherwise bypass auth entirely)
    location = /bt { return 301 /bt/; }
    location /bt/ {
        auth_basic "qBittorrent";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
